[pytest]
testpaths = tests INSTITUT/tests_labor
addopts = -ra --import-mode=importlib
markers =
    langsam: Vortest dauert deutlich laenger als eine halbe Minute (CI: nur manuell, lokal: -m "not langsam" fuer schnelle Laeufe)
    daten: braucht echte Datensaetze aus INSTITUT/daten (sonst wird sauber uebersprungen)
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
