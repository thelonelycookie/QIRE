name: CI

# R3.2: schnelle Tests + Zahlen-Audit + Lint bei jedem Push/PR.
# Langsame Vortests nur manuell: Actions -> CI -> "Run workflow" -> langsam anhaken.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      langsam:
        description: "Auch die langsamen Vortests (@pytest.mark.langsam) rechnen"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  schnell:
    name: Schnelle Tests, Audit, Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml

      - name: Abhaengigkeiten (CPU-torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scipy scikit-learn qiskit pytest ruff

      - name: Lint - Syntax und undefinierte Namen (neue Werkzeuge und Tests, hart)
        run: ruff check --select E9,F63,F7,F82 werkzeuge tests

      - name: Lint - Altmodule in INSTITUT (nur Bericht, kein Abbruch)
        continue-on-error: true
        run: ruff check --select E9,F63,F7,F82 INSTITUT --output-format concise

      - name: FEHLERBUCH-Lint (Abbruch nur bei Warnungen in NEUEN Modulen)
        run: python werkzeuge/fehlerbuch_lint.py --streng

      - name: Seed-Register
        run: python werkzeuge/seeds_pruefen.py

      - name: Zahlen-Audit (LABORBUCH/START gegen ergebnisse/*.json)
        run: python werkzeuge/zahlen_audit.py --streng

      - name: Tests (schnell; Datensatz-Vortests werden ohne INSTITUT/daten uebersprungen)
        run: python -m pytest -m "not langsam" --durations=15 -q

  langsam:
    name: Langsame Vortests (manuell)
    if: github.event_name == 'workflow_dispatch' && inputs.langsam
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml

      - name: Abhaengigkeiten (CPU-torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scipy scikit-learn qiskit pytest

      - name: Langsame Vortests
        run: python -m pytest -m langsam --durations=15 -q
